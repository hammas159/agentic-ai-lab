[project]
name = "db-surgeon"
version = "0.1.0"
description = "Prove a migration's rollback on a throwaway copy before trusting it."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammas159@users.noreply.github.com" }
]
requires-python = ">=3.11"

# sqlite3 is the shadow engine and it is in the standard library. sqlglot and
# Alembic were the planned stack; neither is needed to execute a migration and
# compare two snapshots.
dependencies = []

[project.scripts]
db-surgeon = "dbsurgeon.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbsurgeon"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
