# Infrastructure for the twenty products.
#
# The model server is deliberately NOT here: ollama runs on the host because it
# needs the GPU, and there is one card. See ../products/README.md.
#
# None of the tests need any of this. It is for running a product, not for
# checking one is correct.

name: agentplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No persistence on purpose. Everything in Redis here is working memory,
    # a lock, a budget or a cache — all of it either expires or is rebuildable.
    # Anything that must survive a restart belongs in Postgres or on the bus.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka-compatible, single binary, no ZooKeeper and no JVM. On a 16 GB box
    # shared with a model, that difference is the whole reason it is here.
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  rpdata:
